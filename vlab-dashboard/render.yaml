services:
  - type: web
    name: vlab-dashboard
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/records
    disk:
      name: vlab-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/vlab.db
      - key: COOKIE_SECURE
        value: "1"
